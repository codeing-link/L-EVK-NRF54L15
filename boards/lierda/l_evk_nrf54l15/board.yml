board:
  name: l_evk_nrf54l15
  full_name: L-EVK-NRF54L15
  vendor: lierda
  socs:
    - name: nrf54l15
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - l_evk_nrf54l15/nrf54l15/cpuapp
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - l_evk_nrf54l15/nrf54l15/cpuapp
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - l_evk_nrf54l15/nrf54l15/cpuapp
