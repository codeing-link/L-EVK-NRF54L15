# Enable the L-EVK board serial console and GPIO support.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Use deferred UART logging so sensor and Bluetooth work is not blocked by
# formatted output.  The larger buffer absorbs the GH3220 startup burst while
# the shorter processing interval drains it promptly.
CONFIG_LOG=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_HWINFO=y

# Goodix GH3220 framework. Product register tables come from the vendor
# example while portable code and libraries come from modules/lierda.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_GH3220=y
CONFIG_GH3220_RTC_POLLING=y
CONFIG_GH3220_FUNC_HR_ENABLE=y
CONFIG_GH3220_ALGO=y
CONFIG_GH3220_ALGO_HR=y
CONFIG_GH3220_REG_LIST_SEARCH_PATH="../../modules/lierda/l-evk-t2-gh3220/app_cardiff_a/src/gh3220_sdk"
CONFIG_GH3220_SUPPORT_PROTOCOL_ANALYZE=y
CONFIG_GH3220_PROTOCOL_SERIAL_BLE=y
CONFIG_GH3220_UPLOAD_ALGO_RESULT=y
CONFIG_GH3220_MULTI_SENSOR_EVENT_PROCESS_ENABLE=n
CONFIG_COMPONENT_OSAL_ENABLE=y
CONFIG_OS_ADAPTER_RTOS_ZEPHYR=y
CONFIG_COMPONENT_CORE_FRAMEWORK_ENABLE=y
CONFIG_HEAP_MEM_POOL_SIZE=15360
CONFIG_GH3220_INFO_LOG_LEVEL=3

# MCUboot and MCUmgr image-management support for Bluetooth LE OTA.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y

# Bluetooth LE SMP transport. The radio is an intentional product peripheral;
# the board definition only enables the peripherals populated on L-EVK.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="L-EVK-NRF54L15"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# MCUmgr requests are handled from the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4608
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
